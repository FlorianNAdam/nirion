[package]
name = "nirion-lib"
version = "0.6.0"
edition = "2024"

[dependencies]
nirion-oci-lib = { path = "../nirion-oci-lib" }
anyhow = "1.0.104"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
serde_yaml_ng = "0.10.0"
chrono = "0.4.45"
rustix = { version = "1.1.6", features = ["pty", "termios", "process", "fs"] }
async-trait = "0.1.92"

[dev-dependencies]
nirion-oci-lib = { path = "../nirion-oci-lib", features = ["test-registry"] }
tempfile = "3.27.0"
